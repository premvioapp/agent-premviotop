<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b1a">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{background:#060b1a;color:#eef3ff}</style>
<script>
function pvFatal(m){var r=document.getElementById('root');if(!r)return;r.innerHTML='<div style="max-width:460px;margin:60px auto;padding:20px;border-radius:14px;background:#2a0f16;color:#ffd7dc;font-family:system-ui,sans-serif;line-height:1.5"><b style="font-size:1.1rem">Premvio could not start</b><p style="margin:10px 0 0">'+String(m).replace(/</g,'&lt;')+'</p></div>';window.pvDead=true;}
window.addEventListener('error',function(e){if(e.message&&!window.pvDead)pvFatal(e.message+' — '+String(e.filename||'').split('/').pop()+' line '+e.lineno);},true);
window.addEventListener('unhandledrejection',function(e){var m=(e.reason&&e.reason.message)||String(e.reason);if(/fetch|network/i.test(m))m='Cannot reach the database. Check your internet and the Supabase URL/key in js/config.js. ('+m+')';if(!document.querySelector('#root .card, #root .app, #root .panel'))pvFatal(m);});
</script>
<link rel="stylesheet" href="css/style.css">
<title>Premvio Agent</title>
<meta name="robots" content="noindex">
</head>
<body>
<div id="root"><div class="loader"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
if(!window.supabase)pvFatal('The Supabase library did not load. Check your internet connection and reload.');
else if(!window.PV_CONFIG)pvFatal('js/config.js is missing. Upload the js folder with config.js.');
else if(!PV_CONFIG.SUPABASE_ANON_KEY||/PASTE/.test(PV_CONFIG.SUPABASE_ANON_KEY))pvFatal('Add your Supabase anon key in js/config.js (Supabase → Project Settings → API → anon public), then upload it again.');
</script>
<script src="js/common.js"></script>
<script src="js/agent.js"></script>
</body>
</html>

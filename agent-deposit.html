/* ---------- shrink a phone photo before upload (max 1600px JPEG) ---------- */
function compressImage(file, maxDim = 1600, quality = 0.85, type = "image/jpeg") {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => resolve(b || file), type, quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    setTimeout(() => resolve(file), 8000); // safety: never hang on unusual formats
    img.src = url;
  });
}

/* ---------- searchable pick list: type "p" → every option starting with p ---------- */
// input: <input>, getOptions(): string[], onPick(value): optional
function mountPicker(input, getOptions, onPick) {
  const wrap = document.createElement("div");
  wrap.className = "ac";
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  input.setAttribute("autocomplete", "off");
  const list = document.createElement("div");
  list.className = "ac-list hidden";
  wrap.appendChild(list);
  let active = -1, shown = [];
  const close = () => { list.classList.add("hidden"); active = -1; };
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    const all = getOptions();
    shown = all.filter((o) => o.toLowerCase().startsWith(q));
    if (!all.length) { close(); return; }
    list.innerHTML = shown.length
      ? shown.map((o, i) => `<button type="button" class="ac-item ${i === active ? "on" : ""}" data-i="${i}"><b>${esc(o.slice(0, q.length))}</b>${esc(o.slice(q.length))}</button>`).join("")
      : `<div class="ac-empty">No match for “${esc(input.value.trim())}”</div>`;
    list.classList.remove("hidden");
  };
  const pick = (v) => { input.value = v; close(); onPick && onPick(v); };
  input.addEventListener("focus", () => { active = -1; draw(); });
  input.addEventListener("input", () => { active = -1; draw(); onPick && onPick(null); });
  input.addEventListener("keydown", (e) => {
    if (list.classList.contains("hidden")) return;
    if (e.key === "ArrowDown") { active = Math.min(active + 1, shown.length - 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = Math.max(active - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === "Enter" && active >= 0) { pick(shown[active]); e.preventDefault(); }
    else if (e.key === "Escape") close();
  });
  list.addEventListener("mousedown", (e) => e.preventDefault()); // keep focus while choosing
  list.addEventListener("click", (e) => { const b = e.target.closest(".ac-item"); if (b) pick(shown[Number(b.dataset.i)]); });
  input.addEventListener("blur", () => setTimeout(close, 120));
  return { refresh: draw };
}

/* ---------- date range (calendar) for history pages ---------- */
function ymd(d) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return z.toISOString().slice(0, 10); }
function defaultRange(days = 30) { const to = new Date(); return { from: ymd(new Date(to.getTime() - (days - 1) * 864e5)), to: ymd(to) }; }
function rangeISO(r) {
  const a = new Date(r.from + "T00:00:00"), b = new Date(new Date(r.to + "T00:00:00").getTime() + 864e5);
  return [a.toISOString(), b.toISOString()];
}
function rangeBar(r) {
  return `<div class="toolbar range-bar">
    <label class="row small" style="margin:0;gap:6px">From <input type="date" data-r="from" value="${r.from}" max="${r.to}" style="width:auto"></label>
    <label class="row small" style="margin:0;gap:6px">To <input type="date" data-r="to" value="${r.to}" min="${r.from}" max="${ymd(new Date())}" style="width:auto"></label>
    <button type="button" class="btn sm soft" data-preset="1">Today</button>
    <button type="button" class="btn sm soft" data-preset="7">7 days</button>
    <button type="button" class="btn sm soft" data-preset="30">30 days</button>
    <button type="button" class="btn sm soft" data-preset="90">90 days</button>
  </div>`;
}
// wire a rangeBar inside `root`: calls onChange(newRange) when dates change
function bindRange(root, r, onChange) {
  $$("[data-r]", root).forEach((inp) => (inp.onchange = () => {
    const nr = { ...r, [inp.dataset.r]: inp.value };
    if (!nr.from || !nr.to) return;
    if (nr.from > nr.to) return toast("'From' must be before 'To'.", "error");
    onChange(nr);
  }));
  $$("[data-preset]", root).forEach((b) => (b.onclick = () => onChange(defaultRange(Number(b.dataset.preset)))));
}
function fmtDay(s) { return new Date(s + "T00:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }); }

/* ---- details that appear when an option is chosen (fd.info = {option: text}) ---- */
function optInfoBox(f) {
  const info = f && f.info && typeof f.info === "object" ? f.info : null;
  if (!info || !Object.keys(info).length) return "";
  return `<div class="opt-info" data-oi="${esc(f.id)}" data-info="${esc(JSON.stringify(info))}"></div>`;
}
function optInfoPaint(box) {
  const form = box.closest("form"); if (!form) return;
  let info = {}; try { info = JSON.parse(box.dataset.info || "{}"); } catch (e) {}
  const els = [...form.querySelectorAll(`[name="f_${box.dataset.oi}"]`)];
  const picked = els.filter((el) => (el.type === "radio" || el.type === "checkbox" ? el.checked : true)).map((el) => el.value).filter(Boolean);
  box.innerHTML = picked.filter((v) => info[v]).map((v) => `<div class="info-field"><div class="if-row"><span class="if-val">${esc(info[v])}</span>
    <button type="button" class="btn sm soft" onclick="copyText(this.dataset.v)" data-v="${esc(info[v])}">${ICONS.copy} Copy</button></div></div>`).join("");
}
document.addEventListener("change", (e) => {
  const n = e.target && e.target.name;
  if (!n || !n.startsWith("f_")) return;
  const form = e.target.closest("form"); if (!form) return;
  form.querySelectorAll(`.opt-info[data-oi="${CSS.escape(n.slice(2))}"]`).forEach(optInfoPaint);
});
// boxes added with a value already chosen (editing a cart item, Buy again) show their details straight away
new MutationObserver((list) => {
  for (const m of list) for (const node of m.addedNodes) {
    if (node.nodeType !== 1) continue;
    (node.matches?.(".opt-info") ? [node] : [...node.querySelectorAll?.(".opt-info") || []]).forEach((b) => setTimeout(() => optInfoPaint(b), 0));
  }
}).observe(document.documentElement, { childList: true, subtree: true });

// Method button link: "@premvio", "premvio", "t.me/premvio" or a full https link → a link that opens.
// Telegram usernames open the Telegram app (https://t.me/…). Returns "" if it can't be used.
function pvLink(v) {
  v = String(v || "").trim();
  if (!v) return "";
  if (/^@?[A-Za-z][A-Za-z0-9_]{3,31}$/.test(v)) return "https://t.me/" + v.replace(/^@/, "");
  if (/^tg:\/\//i.test(v)) return v;
  if (/^(t|telegram)\.me\//i.test(v)) return "https://" + v;
  if (!/^https?:\/\//i.test(v) && /^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v)) return "https://" + v;
  return /^https?:\/\//i.test(v) ? v : "";
}
function pvLinkBtn(m, cls = "btn sm deposit") {
  const href = pvLink(m.link);
  if (!href) return "";
  const tg = /^(https:\/\/(t|telegram)\.me\/|tg:)/i.test(href);
  return `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener">${ICONS.send} ${tg ? "Open in Telegram" : "Open " + esc(m.name)}</a>`;
}
// V69: deposit method details as rows the admin names (Name = …, Number = …) — each with Copy
function pmRows(m) {
  return (Array.isArray(m && m.detail_rows) ? m.detail_rows : [])
    .map((r) => ({ label: String((r && r.label) || "").trim(), value: String((r && r.value) || "").trim() }))
    .filter((r) => r.label || r.value);
}
function pmRowsHtml(m) {
  const rows = pmRows(m);
  if (!rows.length) return "";
  return `<div class="pm-rows mt">${rows.map((r) => `<div class="pm-row">
    <div class="grow"><div class="pm-row-l">${esc(r.label)}</div><div class="pm-row-v">${esc(r.value)}</div></div>
    ${r.value ? `<button type="button" class="btn sm soft" onclick="copyText(this.dataset.v)" data-v="${esc(r.value)}">${ICONS.copy} Copy</button>` : ""}</div>`).join("")}</div>`;
}
// V69: red notice the admin writes per deposit method
function pmNoticeHtml(m) {
  const t = String((m && m.notice) || "").trim();
  return t ? `<div class="pm-notice">${esc(t)}</div>` : "";
}
function copyText(t) {
  navigator.clipboard?.writeText(t).then(() => toast("Copied: " + t, "success"), () => toast(t));
}

/* ---------- help chat bubbles for staff (admin + support) ---------- */
function staffBubble(m, custName) {
  if (m.kind === "system") return `<div class="chat-sys">${esc(m.body)} · ${fmtDate(m.created_at)}</div>`;
  return `<div class="bubble ${m.from_staff ? "me" : "them"} ${m.kind === "auto" ? "auto" : ""}">${m.from_staff ? (m.kind === "auto" ? `<div class="who">Auto reply</div>` : "")
    : `<div class="who">${esc(custName || "Customer")}</div>`}<div>${esc(m.body)}</div><div class="t">${fmtDate(m.created_at)}</div></div>`;
}


/* ---------- 🛡️ safety (V59) ---------- */
// Cloudflare "I am human" box (Turnstile). Falls back to the small math check if Turnstile is off.
let PV_TSW = null;
function mountTurnstile(box, onFail) {
  let tok = null, tries = 0;
  const key = CFG.TURNSTILE_SITE_KEY;
  if (!key) return { token: () => "off", reset() {} };
  const T = () => window.turnstile;
  const fail = (msg) => {
    if (!document.body.contains(box)) return;
    if (onFail) { onFail(); return; }
    box.innerHTML = `<div class="ts-fail"><span>${esc(msg)}</span><button type="button" class="btn sm soft" id="tsRetry">Try again</button></div>`;
    $("#tsRetry", box).onclick = () => { tries = 0; draw(); };
  };
  const draw = () => {
    if (!document.body.contains(box)) return;
    if (!T()) {
      if (++tries > 60) return fail("Security check did not load. Check your internet.");
      return setTimeout(draw, 250);
    }
    try { if (PV_TSW != null) T().remove(PV_TSW); } catch (e) {}
    PV_TSW = null; tok = null;
    box.innerHTML = "";
    const holder = document.createElement("div");
    box.appendChild(holder);
    try {
      PV_TSW = T().render(holder, {
        sitekey: key, size: "flexible", appearance: "always", retry: "auto", "refresh-expired": "auto",
        theme: document.documentElement.dataset.theme === "light" ? "light" : "dark",
        callback: (t) => { tok = t; },
        "expired-callback": () => { tok = null; },
        "error-callback": (code) => { tok = null; fail("Security check error" + (code ? " (" + code + ")" : "") + "."); return true; },
      });
    } catch (e) { fail("Security check error."); }
  };
  draw();
  return { token: () => tok, reset() { tok = null; try { if (PV_TSW != null) T().reset(PV_TSW); else draw(); } catch (e) { draw(); } } };
}


// staff = true: if Cloudflare can't load on this site, use the small math check instead (staff can always log in)
function humanCheck(box, staff) {
  let cur = null;
  const math = () => {
    box.innerHTML = ""; box.classList.remove("ts-box");
    if (!box.previousElementSibling?.classList?.contains("cap-lbl")) box.insertAdjacentHTML("beforebegin", `<label class="cap-lbl">Security check</label>`);
    const cap = mountCaptcha(box);
    cur = { token: () => null, reset: () => cap.reset(), ready() { if (!cap.ok()) { toast("Wrong captcha answer.", "error"); cap.reset(); return false; } return true; } };
  };
  if (CFG.TURNSTILE_SITE_KEY && (window.turnstile || document.querySelector('script[src*="challenges.cloudflare.com"]'))) {
    const ts = mountTurnstile(box, staff ? math : null);
    cur = { token: () => ts.token(), reset: () => ts.reset(),
      ready() { if (!ts.token()) { toast("Please complete the “I am human” check.", "error"); return false; } return true; } };
  } else math();
  return { token: () => cur.token(), reset: () => cur.reset(), ready: () => cur.ready() };
}
// Checks the lock (5 wrong passwords = 15 minutes) before signing in. Throws a friendly error.
async function loginGate(email, password, captcha, wrongMsg = "Wrong email or password.") {
  const { data, error } = await sb.rpc("login_check", { p_email: email, p_password: password, p_captcha: captcha || null });
  if (error) { if (/login_check|PGRST202|function/i.test(error.message || "") && !isNetErr(error)) return; throw error; }   // update not installed yet → normal login
  if (data?.ok) return;
  if (data?.locked) throw new Error(`Too many wrong tries. Please try again in ${data.locked} minute${data.locked == 1 ? "" : "s"}.`);
  if (data?.captcha) throw new Error("The “I am human” check failed. Please try again.");
  throw new Error(wrongMsg + (data?.left != null && data.left <= 3 ? ` ${data.left} ${data.left == 1 ? "try" : "tries"} left.` : ""));
}
// new device → alert (customers get it themselves, staff logins also alert every admin)
function deviceLabel() {
  const ua = navigator.userAgent;
  const os = /Android/i.test(ua) ? "Android" : /iPhone|iPad|iPod/i.test(ua) ? "iPhone" : /Windows/i.test(ua) ? "Windows" : /Mac OS/i.test(ua) ? "Mac" : /Linux/i.test(ua) ? "Linux" : "device";
  const br = /Edg\//.test(ua) ? "Edge" : /SamsungBrowser/.test(ua) ? "Samsung Internet" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Browser";
  return `${isStandalone() ? "Premvio app" : br} on ${os}`;
}
async function registerDevice() {
  let id = null;
  try { id = localStorage.getItem("pv_device"); if (!id) { id = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); localStorage.setItem("pv_device", id); } } catch (e) { return; }
  sb.rpc("register_device", { p_device: id, p_label: deviceLabel() }).then(() => {}, () => {});
}
// Admin panel: log out after N minutes without any tap or key press (all tabs together)
function idleLogout(minutes) {
  const KEY = "pv_last_act", mark = () => { try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {} };
  mark();
  let last = 0;
  ["pointerdown", "keydown", "scroll", "touchstart"].forEach((ev) => addEventListener(ev, () => { if (Date.now() - last > 5000) { last = Date.now(); mark(); } }, { passive: true }));
  setInterval(async () => {
    let t = Date.now(); try { t = Number(localStorage.getItem(KEY)) || Date.now(); } catch (e) {}
    if (Date.now() - t > minutes * 60000) {
      try { sessionStorage.setItem("pv_idle_out", "1"); } catch (e) {}
      await pvSignOut(); location.hash = ""; location.reload();
    }
  }, 30000);
}
function idleNotice() {
  try { if (sessionStorage.getItem("pv_idle_out")) { sessionStorage.removeItem("pv_idle_out"); setTimeout(() => toast("Logged out after 15 minutes without activity.", "error"), 300); } } catch (e) {}
}
// "Log out all other devices" button (staff panels)
function outOthersHtml() { return `<button class="btn danger block mt" id="outOthers">Log out all other devices</button>`; }
function bindOutOthers(scope) {
  const b = $("#outOthers", scope || document);
  if (!b) return;
  b.onclick = async () => {
    if (!(await confirmBox("Log out all other devices?", "Every other phone or computer using this ID is logged out. This device stays logged in.", "Log out others", true))) return;
    busy(b, async () => {
      const { error } = await sb.auth.signOut({ scope: "others" });
      if (error) throw error;
      toast("All other devices are logged out.", "success");
    });
  };
}

</script>
<script>
/* ============ PREMVIO — Agent Deposit Portal (agent-deposit.html) ============
   Agents log in with their agent ID + password, choose a deposit option, pay,
   upload the screenshot and submit. No amount is typed here: the admin confirms
   the amount and it goes straight to the agent's balance. */
const DP = { me: null, methods: [], channel: null };
const root = $("#root");

sb.auth.getSession().then(async ({ data }) => {
  if (data.session) {
    try {
      const p = await getMyProfile();
      if (p && p.role === "agent" && !p.blocked) return start(p);
      await pvSignOut();
    } catch (e) {}
  }
  staffLogin(root, "Agent", ["agent"], start);
});

function start(p) {
  DP.me = p;
  applyTheme("dark");
  document.body.classList.add("agent-ui");
  root.innerHTML = `
  <div class="app dp-app">
    <header class="desk-head">
      <img src="${PV_LOGO}" alt="">
      <div class="grow"><div class="row" style="gap:8px"><span class="desk-tag">AGENT</span><span class="desk-name">Deposit portal</span></div>
        <div class="desk-sub">${esc(p.full_name)}</div></div>
      <button class="icon-btn" id="out" title="Log out" aria-label="Log out">${ICONS.logout}</button>
    </header>
    <a class="dp-back" href="agent.html">← Back to agent desk</a>
    <main id="screen"></main>
  </div>`;
  $("#out").onclick = async () => { if (DP.channel) sb.removeChannel(DP.channel); await pvSignOut(); location.reload(); };
  // balance + my deposits refresh by themselves when the admin approves
  DP.channel = sb.channel("dp-" + p.id)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "profiles", filter: `id=eq.${p.id}` }, (x) => {
      DP.me = { ...DP.me, ...x.new };
      $$("[data-balance]").forEach((el) => (el.textContent = money(DP.me.balance)));
    })
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "notifications", filter: `user_id=eq.${p.id}` }, (x) => {
      toast(x.new.title + (x.new.body ? " — " + x.new.body : ""), "success");
      if ($("#dpList")) drawMine();
    })
    .subscribe();
  home();
  registerDevice();
}

function idCard() {
  return `<div class="dp-id">
    <div class="row between"><div><div class="k">Your agent ID</div><div class="v mono">${esc(DP.me.member_id)}</div></div>
      <button class="btn sm soft" onclick="copyText('${esc(DP.me.member_id)}')">${ICONS.copy} Copy</button></div>
    <div class="row between dp-bal"><span class="k">Agent balance</span><b data-balance>${money(DP.me.balance)}</b></div>
  </div>`;
}
function logo(m) {
  return `<span class="pm-logo">${m.logo_url ? `<img src="${esc(m.logo_url)}" alt="">` : `<b>${esc(m.name.slice(0, 2).toUpperCase())}</b>`}</span>`;
}

/* ---------- Step 1: agent ID + deposit option buttons + my deposits ---------- */
async function home() {
  const s = $("#screen");
  s.className = "";
  s.innerHTML = `${idCard()}
    <h3 class="dp-h">Choose a deposit option</h3>
    <div id="pmGrid" class="pm-grid"><div class="loader"></div></div>
    <div class="recent-head"><b>My deposits</b></div>
    <div id="dpList" class="card recent"><div class="loader"></div></div>`;
  window.scrollTo(0, 0);
  drawMine();
  const { data, error } = await sb.from("payment_methods").select("*").eq("kind", "deposit").eq("active", true).order("sort").order("id");
  const grid = $("#pmGrid");
  if (!grid) return;
  if (error) { grid.outerHTML = `<div class="empty">${esc(errMsg(error))}</div>`; return; }
  DP.methods = (data || []).filter((m) => (m.audience || "both") !== "customers");
  if (!DP.methods.length) { grid.outerHTML = `<div class="card empty"><div class="big">💳</div>No deposit options yet. Please contact Premvio.</div>`; return; }
  grid.innerHTML = DP.methods.map((m) => `<button class="pm-tile" data-pm="${m.id}">${logo(m)}<span class="pm-name">${esc(m.name)}</span></button>`).join("");
  $$("[data-pm]", grid).forEach((b) => (b.onclick = () => method(DP.methods.find((m) => m.id == b.dataset.pm))));
}

// only successful deposits of the last 30 days
async function drawMine() {
  const box = $("#dpList");
  const since = new Date(Date.now() - 30 * 864e5).toISOString();
  const { data, error } = await sb.from("deposit_requests").select("id, amount, decided_at, created_at").eq("user_id", DP.me.id)
    .eq("status", "approved").gte("created_at", since).order("created_at", { ascending: false }).limit(100);
  if (!box || !document.body.contains(box)) return;
  if (error) { box.innerHTML = `<div class="empty">${esc(errMsg(error))}</div>`; return; }
  box.innerHTML = data.length ? data.map((d) => `
    <div class="list-item"><div class="grow"><b>Deposit successful</b><div class="small muted">${fmtDate(d.decided_at || d.created_at)}</div></div>
      <div class="num" style="font-weight:800;color:var(--green)">+${money(d.amount || 0)}</div></div>`).join("")
    : `<div class="empty">No deposits in the last 30 days</div>`;
}

/* ---------- Step 2: only the chosen option's details + form ---------- */
function method(m) {
  const s = $("#screen");
  const fields = m.fields || [];
  const proof = m.proof_mode || "required";
  s.className = "slide-in";
  s.innerHTML = `<div class="screen-head"><button class="back-btn" id="back" aria-label="Back">←</button>
      <h2 style="margin:0">${esc(m.name)}</h2></div>
    <div class="card pm-panel">
      ${pmNoticeHtml(m)}
      <div class="row">${logo(m)}<div class="grow"><b style="font-size:1.05rem">${esc(m.name)}</b></div></div>
      ${pmRowsHtml(m)}
      ${m.details ? `<div class="pm-info mt">${esc(m.details)}</div>` : ""}
      <div class="row wrap mt" style="gap:8px">
        ${m.details ? `<button class="btn sm soft" id="cpDet">${ICONS.copy} Copy details</button>` : ""}
        ${pvLinkBtn(m)}
        <button class="btn sm soft" onclick="copyText('${esc(DP.me.member_id)}')">${ICONS.copy} My ID ${esc(DP.me.member_id)}</button>
      </div>
      <form id="dpf" class="mt">
        ${fields.map(dpField).join("")}
        ${proof === "off" ? "" : `<label>Payment screenshot ${proof === "required" ? `<span style="color:var(--red)">*</span>` : `<span class="muted">(optional)</span>`}</label>
        <input type="file" name="proof" accept="image/*" ${proof === "required" ? "required" : ""}>
        <img id="proofPrev" class="doc-preview hidden" alt="">`}
        <button class="btn block deposit mt">Submit deposit</button>
      </form></div>`;
  window.scrollTo(0, 0);
  $("#back").onclick = home;
  if ($("#cpDet")) $("#cpDet").onclick = () => copyText(m.details);
  const f = $("#dpf");
  if (f.proof) f.proof.onchange = () => { const fl = f.proof.files[0]; if (fl) { $("#proofPrev").src = URL.createObjectURL(fl); $("#proofPrev").classList.remove("hidden"); } };
  f.onsubmit = (e) => {
    e.preventDefault();
    const file = f.proof?.files?.[0] || null;
    if (proof === "required" && !file) return toast("Please add a screenshot of your payment.", "error");
    const form = {};
    for (const fd of fields) form[fd.id] = (f.elements["f_" + fd.id]?.value || "").trim();
    busy($("button.btn", f), async () => {
      let path = null;
      if (file) {
        const blob = await compressImage(file);
        if (blob.size > 6 * 1024 * 1024) throw new Error("Screenshot is too large.");
        path = `${DP.me.id}/agent-dep-${Date.now()}.jpg`;
        const { error: upErr } = await sb.storage.from("proofs").upload(path, blob, { contentType: blob.type || "image/jpeg", upsert: false });
        if (upErr) throw upErr;
      }
      const { data, error } = await sb.rpc("agent_request_deposit", { p_method: m.id, p_form: form, p_proof: path });
      if (error) throw error;
      try { fields.forEach((fd) => { if (form[fd.id] && fd.type !== "textarea") localStorage.setItem("pv_field_" + fd.label.toLowerCase(), form[fd.id]); }); } catch (er) {}
      done(data, m);
    });
  };
}
function dpField(f) {
  if (f.type === "info") return `<div class="info-field"><div class="if-label">${esc(f.label)}</div>
    <div class="if-row"><span class="if-val">${esc(f.value || "")}</span>
    <button type="button" class="btn sm soft" onclick="copyText(this.dataset.v)" data-v="${esc(f.value || "")}">${ICONS.copy} Copy</button></div></div>`;
  const name = `f_${esc(f.id)}`, req = f.required ? "required" : "", ph = esc(f.placeholder || "");
  let saved = "";
  try { saved = localStorage.getItem("pv_field_" + f.label.toLowerCase()) || ""; } catch (e) {}
  const label = `<label>${esc(f.label)}${f.required ? "" : ' <span class="muted">(optional)</span>'}</label>`;
  if (f.type === "select") return label + `<select name="${name}" ${req}><option value="">Choose…</option>${(f.options || []).map((o) => `<option ${saved === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>` + optInfoBox(f);
  if (f.type === "textarea") return label + `<textarea name="${name}" ${req} maxlength="500" placeholder="${ph}"></textarea>`;
  if (f.type === "number") return label + `<input type="number" step="any" name="${name}" ${req} placeholder="${ph}" inputmode="decimal">`;
  return label + `<input name="${name}" ${req} maxlength="200" placeholder="${ph}" value="${esc(saved)}">`;
}

/* ---------- Step 3: success message ---------- */
function done(id, m) {
  const s = $("#screen");
  s.className = "slide-in";
  s.innerHTML = `<div class="card dp-done">
    <div class="dp-check">✓</div>
    <h2>Deposit submitted successfully</h2>
    <p class="muted">Deposit <b>#${esc(id)}</b> via <b>${esc(m.name)}</b> was sent for approval.</p>
    <div class="pm-info" style="text-align:left">We will check your payment and add the money to your agent ID <b class="mono">${esc(DP.me.member_id)}</b>. You'll get a notification.</div>
    <button class="btn block mt" id="again">Back to deposit options</button>
  </div>`;
  window.scrollTo(0, 0);
  $("#again").onclick = home;
}

</script>
